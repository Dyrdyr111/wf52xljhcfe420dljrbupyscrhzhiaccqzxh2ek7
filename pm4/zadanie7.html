<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koszt cegieł i transportu</title>
</head>
<body>
    <h1>Kalkulator cegieł i transportu</h1>
    <form id="formularz">
        <label for="ilosc">Ilość cegieł:</label>
        <input type="number" id="ilosc" min="1" step="1" required>
        <br>
        <label for="premium">Cegła premium</label>
        <input type="checkbox" id="premium">
        <br>
        <label for="kilometry">Ilość kilometrów:</label>
        <input type="number" id="kilometry" min="0" step="any" required>
        <br>
        <button type="submit">Oblicz</button>
    </form>
    <p id="wynik" aria-live="polite"></p>

    <script>
        const formularz = document.getElementById("formularz");
        const ilosc = document.getElementById("ilosc");
        const premium = document.getElementById("premium");
        const kilometry = document.getElementById("kilometry");
        const wynik = document.getElementById("wynik");

        formularz.addEventListener("submit", (event) => {
            event.preventDefault();
            const liczba = Number(ilosc.value);
            const odleglosc = Number(kilometry.value);
            if (!Number.isInteger(liczba) || liczba < 1) {
                wynik.textContent = "Podaj dodatnią, całkowitą liczbę cegieł.";
                return;
            }
            if (!Number.isFinite(odleglosc) || odleglosc < 0) {
                wynik.textContent = "Podaj nieujemną liczbę kilometrów.";
                return;
            }

            const wagaJednej = premium.checked ? 1.75 : 1.5;
            const waga = liczba * wagaJednej;
            const koszt = liczba * 2 * (premium.checked ? 1.3 : 1);
            const kosztTransportu = odleglosc * Math.ceil(waga / 10) * 0.5;
            const rodzaj = premium.checked ? "cegła premium" : "cegła standardowa";
            wynik.textContent = `Zakupiona ilość cegieł: ${liczba}, ${rodzaj}, koszt zakupu cegieł: ${koszt.toFixed(2)} zł, waga cegieł: ${waga.toFixed(2)} kg, koszt transportu: ${kosztTransportu.toFixed(2)} zł`;
        });
    </script>
</body>
</html>
