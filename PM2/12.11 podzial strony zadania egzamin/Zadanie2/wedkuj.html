<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wędkujemy</title>
<style>
body {
    font-family: Verdana;
}

header, footer {
    background-color: #4682B4;
    color: white;
    padding: 20px;
    font-size: 120%;

    clear:both
}

aside {
    background-color: #40E0D0;
    height: 500px;
    float:left;
}

#lewy {
    width: 40%;
}

#prawy {
    width: 60%;
}

    padding: 5px;
    margin: 10px;
    border: 1px solid #000080;
}

<body>
<header>
    <h1>Portal dla wędkarzy</h1>
</header>

<aside id="lewy">
    <h2>Ryby drapieżne naszych wód</h2>
    <ul type="disc">
        <li>Szczupak, występowanie: stawy, rzeki</li>
        <li>Sandacz, występowanie: stawy, jeziora, rzeki</li>
        <li>Okoń, występowanie: rzeki</li>
        <li>Sum, występowanie: jeziora, rzeki</li>
        <li>Dorsz, występowanie: morza, oceany</li>
    </ul>
</aside>

<aside id="prawy">
    <img src="ryba.jpg" alt="Sum"> <br>
    <a href="https://www.youtube.com/watch?v=Aq5WXmQQooo" >Pobierz Kwerendy</a>
