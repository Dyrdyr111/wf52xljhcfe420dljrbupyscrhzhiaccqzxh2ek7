<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Podzial Strony - Przyklad 1</title>
</head>
<body>
    <!-- Atrybuty diva: style, dir (kierunek tekstu bloku), align - wyrównanie zawartości elementów w poziomie, float:left - bloki obok siebie
     title - tekst wyswietlany po najechaniu
     clear:both - blok ktory ma sie nie ukladac obok musi miec zapis tzw. blokowe odplywanie-->

    <div style="background-color:#d1dcf3; height: 10%; width: 50%">Pierwszy blok</div>
    <div title="Test">Przykładowy tekst</div>
    <div style="background-color:blue;height: 10%; width: 40%">Drugi blok</div>
    <div style="background-color:#00cc00;height: 10%; width: 30%">Trzeci blok</div>

</body>
</html>
