<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Podzial Strony - Przyklad 3</title>
<style>
body, html{
    height:100%;
    margin: 0;
}

header{
    background-color: blue;
    height: 10%;
    text-align: center; 
}

section{
    background-color: #ccff33;
    width: 50%; 
    height: 80%;
    text-align: left;
    float: left; 
}

aside{
    background-color: #6699ff;
    width: 50%; 
    height: 80%;
    text-align: center;
    float: left;
}

footer{
    background-color: #dddddd;
    height: 10%; 
    text-align: center;
    clear: both;
}
</style>
</head>
<body>
     <header>To jest nagłówek strony</header>
    <section>To jest lewy panel</section>
    <aside>To jest prawy panel</aside>
    <footer>To jest stopka strony</footer>
</body>
</html>
