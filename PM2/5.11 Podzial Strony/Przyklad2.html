<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Podzial Strony - Przyklad 2</title>
<style>
    body, html{
        height:100%;
        margin: 0;
    }
    #baner{
        background-color: blue;
        height: 15%;
        color: white;
        text-align: center; 
    }
    .blok1{
           background-color: #eeeeee;
           width: 50%; 
           height: 85%; 
           float: left;       
    }
</style>
</head>
<body>
   <div id="baner">Pierwszy blok</div>
    <div class="blok1">Drugi blok</div>
    <div class="blok1">Trzeci blok</div>
 

        <!--
    <header> - baner strony, jakiś tytuł, nagłówki <h>
    <nav> - główne menu strony (nawigacja)
    <main> - główna część strony - są w niej inne znaczniki
    <article> - np. forum z postami, i w tym posty
    <aside> - tzw. pasek boczny np. reklamy 
    <figure> - blok ze zdjęciem i podpisem (<figcaption>)
    <footer> - stopka strony
    <section> - sekcja strony -->

    
</body>
</html>
