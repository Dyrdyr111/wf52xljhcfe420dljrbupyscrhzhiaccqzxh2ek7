<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 1</title>
</head>
<style>
    body, html{
        height: 100%;
        margin: 0;
    }

    header{
        background-color: lightgray;
        width: 100%;
        height: 10%;
        text-align: center;
        border: 1px solid black;
    }

    nav{
        background-color: lightgray;
        width: 100%;
        height: 10%;
        border: 1px solid black;
        text-align: center;
    }

    main{
        background-color: lightgray;
        width: 100%;
        height: 60%;
        border: 1px solid black;
        text-align: center;
    }

    aside{
        background-color: lightgray;
        width: 100%;
        height: 10%;
        border: 1px solid black;
        text-align: center;
    }

    footer{
        background-color: lightgray;
        width: 100%;
        height: 10%;
        text-align: center;
        border: 1px solid black;
    }

    .menu{
        width: 23%;
        float: left;
    }

    .menu_dod{
        width: 33%;
        float: left;
    }


</style>
<body>
    <header>Logo</header>
    <nav>
        <div class="menu"><a href="https://www.wp.pl">Strona główna</a></div>
        <div class="menu"><a href="https://www.interia.pl">Usługi</a></div>
        <div class="menu"><a href="https://www.o2.pl">O nas</a></div>
        <div class="menu"><a href="https://www.onet.pl">Kontakt</a></div>
    </nav>
    <main>
        <h1>Opis</h1>
    </main>
    <aside>
        <div class="menu_dod"><a href="https://www.wp.pl">Link 1</a></div>
        <div class="menu_dod"><a href="https://www.interia.pl">Link 2</a></div>
        <div class="menu_dod"><a href="https://www.o2.pl">Link 3</a></div>
    </aside>
    <footer>Stopka</footer>
</body>
</html>
